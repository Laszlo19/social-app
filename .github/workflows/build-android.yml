name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, and the Hermes source build
    # (React Native is built from source since 1.136) last succeeded on 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from package.json (devEngines), same as upstream CI
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile translations
        run: pnpm intl:compile

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the legacy `tools` package,
          # which current sdkmanager releases no longer ship ("Failed to find
          # package 'tools'"), failing the step.
          packages: platform-tools

      - name: Install Android NDK
        # react-native-mmkv (and other native modules on RN 0.81) require this
        # exact NDK. Install it explicitly so Gradle doesn't auto-download it
        # mid-build, which has produced corrupt archives ("Archive is not a ZIP
        # archive"). Retry to survive transient CDN hiccups.
        run: |
          for attempt in 1 2 3; do
            if yes | sdkmanager --install "ndk;27.1.12297006"; then
              echo "NDK installed on attempt $attempt"
              exit 0
            fi
            echo "NDK install attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install ndk;27.1.12297006 after 3 attempts"
          exit 1

      - name: Create placeholder google-services.json
        run: |
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "bluesky-placeholder",
              "storage_bucket": "bluesky-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "xyz.blueskyweb.app.dev"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyPLACEHOLDER0PLACEHOLDER0PLACEHOLDER00" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_ENV: development
          EXPO_PUBLIC_SIDELOAD: 'true'

      - name: Point alternate icon aliases at adaptive resources
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Repoint each alternate icon activity-alias (default_*/core_*) at the
          # adaptive-icon XML generated by the withAndroidAdaptiveAltIcons
          # plugin, so the launcher masks them. ic_launcher is left untouched.
          sed -i -E \
            -e 's#(android:roundIcon=")@mipmap/((default|core)_[a-z_]+)"#\1@mipmap/ic_adaptive_\2"#g' \
            -e 's#(android:icon=")@mipmap/((default|core)_[a-z_]+)"#\1@mipmap/ic_adaptive_\2"#g' \
            "$MANIFEST"
          echo "--- alias icon refs after rewrite ---"
          grep -nE 'android:icon="@mipmap/(default|core)|ic_adaptive' "$MANIFEST" | head -40

      - name: Install host build dependencies
        # React Native is built from source (since 1.136), and its Hermes host
        # compiler (hermesc) needs ICU and Python on the build machine
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libicu-dev ninja-build python3

      - name: Download Hermes source
        # React Native 0.88 downloads Hermes from github.com/facebook/hermes and
        # strips a "facebook-hermes-*" top folder from the tarball. GitHub now
        # serves it from meta/hermes with a "meta-hermes-*" folder, so the
        # source lands one level too deep and CMake can't find CMakeLists.txt.
        # Unpack it ourselves and point React Native at it; with
        # REACT_NATIVE_OVERRIDE_HERMES_DIR set it skips its own download.
        run: |
          version=$(tr -d '[:space:]' < node_modules/react-native/sdks/.hermesv1version)
          dest="$RUNNER_TEMP/hermes"
          mkdir -p "$dest"
          curl -fsSL --retry 5 "https://github.com/facebook/hermes/tarball/$version" \
            | tar -xz -C "$dest" --strip-components=1
          test -f "$dest/CMakeLists.txt"
          echo "Hermes $version unpacked to $dest"
          echo "REACT_NATIVE_OVERRIDE_HERMES_DIR=$dest" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # On failure, surface the actual errors as annotations. Native tools
      # (CMake for Hermes, the NDK) write their details to separate log files
      # that Gradle's summary doesn't show, and annotations can be read from
      # the run page and the public API without opening the full log.
      - name: Report build errors
        if: failure()
        run: |
          annotate() {
            # $1 = title, stdin = text; GitHub caps each annotation, so keep it short
            local text
            text=$(tail -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$text" ]; then echo "::error title=$1::$text"; fi
          }
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            grep -n -i -A25 'What went wrong' "$RUNNER_TEMP/gradle.log" | annotate 'Gradle: what went wrong'
            grep -n -i -B2 -A15 'CMake Error\|error:\|FAILED' "$RUNNER_TEMP/gradle.log" | head -c 20000 | annotate 'Gradle: errors'
          fi
          find android node_modules/react-native -type f \( \
            -name 'configure-hermesc*.log' -o -name 'CMakeError.log' -o -name 'CMakeConfigureLog.yaml' \
          \) 2>/dev/null | head -5 | while read -r f; do
            annotate "$f" < "$f"
          done

      - name: Rename APK for release
        run: |
          mkdir -p dist
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/bluesky-dev-${APP_VERSION}-build${{ github.run_number }}.apk"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-dev-build${{ github.run_number }}
          name: Bluesky Dev ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          prerelease: true
          files: dist/bluesky-dev-${{ env.APP_VERSION }}-build${{ github.run_number }}.apk
          body: |
            Sideload-ready **Bluesky Dev** APK (applicationId `xyz.blueskyweb.app.dev`,
            installs alongside the official app).

            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            Download the `.apk` below and sideload it (e.g. drag onto a Nox emulator).
